name: Generate F-Droid repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC
  repository_dispatch:
    types: [app-released]

permissions:
  contents: write

concurrency:
  group: fdroid-repo
  cancel-in-progress: false

jobs:
  generate:
    name: Generate F-Droid repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create directories
        run: mkdir -p fdroid/repo fdroid/metadata

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner pipx wget jq
          pipx install fdroidserver
          pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Decode secrets
        run: |
          echo "${{ secrets.KEYSTORE_P12 }}" | base64 -d > fdroid/keystore.p12
          echo "${{ secrets.CONFIG_YML }}" | base64 -d > fdroid/config.yml
          chmod 600 fdroid/config.yml fdroid/keystore.p12

      - name: Download latest APK from video-player
        run: |
          # Get latest release asset
          API="https://api.github.com/repos/mounsokdara/video-player/releases/latest"
          DOWNLOAD_URL=$(curl -sL "$API" | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n1)
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "No APK found in latest release"
            exit 1
          fi
          echo "Downloading: $DOWNLOAD_URL"
          wget -q -O fdroid/repo/com.mounsokdara.video_player.apk "$DOWNLOAD_URL"
          ls -lh fdroid/repo/

      - name: Run fdroid update
        run: |
          cd fdroid
          fdroid update --create-metadata -v
          # Keep only the latest few versions if needed
          ls -la repo/

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fdroid/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated F-Droid repo update"
            git push
          fi
