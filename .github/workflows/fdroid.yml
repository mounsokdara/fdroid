name: Generate F-Droid repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC
  repository_dispatch:
    types: [app-released]

permissions:
  contents: write

concurrency:
  group: fdroid-repo
  cancel-in-progress: false

jobs:
  generate:
    name: Generate F-Droid repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create directories
        run: mkdir -p fdroid/repo fdroid/metadata

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner pipx wget jq
          pipx install fdroidserver
          pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Decode secrets
        env:
          KEYSTORE_P12: ${{ secrets.KEYSTORE_P12 }}
          CONFIG_YML: ${{ secrets.CONFIG_YML }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_P12" | base64 -d > fdroid/keystore.p12
          printf '%s' "$CONFIG_YML" | base64 -d > fdroid/config.yml

      - name: Download latest APK from video-player
        run: |
          # Releases carry one APK per CPU, the F-Droid repo uses the universal one.
          # v1.0.5+ names it "-universal.apk", older releases used plain "com.mounsokdara.video_player.apk".
          # Use the /releases/latest/download redirect: no GitHub API call, so no unauthenticated rate limit (403).
          BASE="https://github.com/mounsokdara/video-player/releases/latest/download"
          OUT="fdroid/repo/com.mounsokdara.video_player.apk"
          for NAME in com.mounsokdara.video_player-universal.apk com.mounsokdara.video_player.apk; do
            echo "Trying: $BASE/$NAME"
            if curl -fL --retry 3 --retry-delay 5 -o "$OUT" "$BASE/$NAME"; then
              echo "Downloaded $NAME"
              FOUND=1
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::No universal APK found in latest release of mounsokdara/video-player"
            exit 1
          fi
          ls -lh fdroid/repo/

      - name: Verify APK signer matches AllowedAPKSigningKeys
        run: |
          want=$(sed -n 's/^AllowedAPKSigningKeys:[[:space:]]*//p' fdroid/metadata/com.mounsokdara.video_player.yml | tr -d "[:space:]'")
          got=$(apksigner verify --print-certs fdroid/repo/com.mounsokdara.video_player.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)
          echo "want=$want"; echo "got =$got"
          [ -n "$want" ] && [ "$want" = "$got" ] || { echo "::error::APK is not signed by the allowed key"; exit 1; }

      - name: Run fdroid update
        run: |
          cd fdroid
          fdroid update --delete-unknown -v
          # Keep only the latest few versions if needed
          ls -la repo/

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fdroid/repo fdroid/metadata
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated F-Droid repo update"
            git push
          fi

      - name: Remove secrets from runner
        if: always()
        run: rm -f fdroid/keystore.p12 fdroid/config.yml
