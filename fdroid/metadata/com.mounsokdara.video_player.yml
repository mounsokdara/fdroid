Builds:
  - versionName: 1.0.3
    versionCode: 121
    commit: 606e36fc0d92b38c40e7c2416baf92939416a829
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: https://github.com/mounsokdara/video-player/releases/download/v%v/com.mounsokdara.video_player-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E 's/.*flutter-version:[[:space:]]*"?([0-9.]+).*/\1/p'
        .github/workflows/build-apk.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform
        android-arm --dart-define=FDROID=true --dart-define=APP_VERSION=$(cut -d+
        -f1 version.txt)

