Builds:
  - versionName: 1.0.4
    versionCode: 131
    commit: 88682469b5c58baec922427fffbbbb95b95b8eb8
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E 's/.*flutter-version:[[:space:]]*"?([0-9.]+).*/\1/p'
        .github/workflows/build-apk.yml | head -n1)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform
        android-arm --dart-define=FDROID=true --dart-define=APP_VERSION=$(cut -d+
        -f1 version.txt)

